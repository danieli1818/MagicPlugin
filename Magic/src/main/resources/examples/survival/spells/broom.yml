broom:
    # This refers to an icon defined in the icons folder/config
    icon: broom
    hidden: true
    category: specialty
    tags: noduel
    worth: 600
    upgrade_required_path: broom
    upgrade_required_casts: 20
    world_border_restricted: true
    cast_on_no_target: false
    cancellable: false
    show_undoable: false
    undoable: false
    reactivate: true
    active_spells_restricted: broom,superbroom,levitate,superfly
    actions:
      reactivate:
        - class: MountArmorStand
          find_wand: true
      cast:
        - class: ChangeContext
          target_offset: 0,1,0
          ignore_result: true
          actions:
            - class: Volume
              radius: 1
              actions:
                - class: CheckBlock
                  allowed: passthrough
                  fail:
                    - class: Message
                      ignore_result: true
                      message_type: action_bar
                      message_key: nospace
                    - class: CastResult
                      result: no_target
                      end_result: true
                    - class: Stop
        - class: Cancel
          spell: broom
        - class: MountArmorStand
    effects:
        cast:
        -  class: EffectSingle
           sound: entity_enderdragon_flap
           sound_volume: 1.1
        -  class: EffectSingle
           effectlib:
             class: TraceEffect
             iterations: 30
             particle: spell
        crash:
        -  class: EffectSingle
           location: origin
           entity_effect: hurt
           particle: explosion_large
        -  class: EffectSingle
           location: origin
           effectlib:
             class: SmokeEffect
             iterations: 12
        land:
        -  sound: block_stone_step
           sound_pitch: 0.7
        -  class: EffectRing
           particle: block_crack
           source_location: feet
           period: 4
           particle_count: 80
           radius: 4
           particle_offset_x: 0.9
           particle_offset_z: 0.9
           particle_offset_y: 0.1
    parameters:
        target: self
        mount_name: Broomstick
        mount_wand: true
        replacement_item: broomstick_handle
        start_speed: 0.2
        min_speed: 0.1
        max_deceleration: 0.02
        bypass_confusion: false
        liftoff_duration: 600
        liftoff_thrust: 1
        fall_protection: 8000
        duration: 60000
        duration_warning: 10000
        cooldown: 15000
        crash_distance: 0.9
        crash_effects:
          confusion: 120,3
        warning_effects:
          confusion: 5
        cancel_on_no_permission: true
        cancel_on_world_change: true
        cancel_on_enter_portal: true
        sound: magic.flying
        sound_interval: 500
        sound_max_volume: 0.25
        sound_min_volume: 0.05
        sound_max_pitch: 2
        sound_min_pitch: 0.5
        armor_stand_pitch: 0.3
        controllable: true
        strafe_controllable: 1
        jump_controllable: 1
        sneak_controllable: 1
        exemption_duration: 5000
        armor_stand_marker: false
        dismount_height: 8

        # Hitbox tuning
        # armor_stand_scale sets the SCALE attribute of the armor stand: it shrinks the vanilla
        # collision box, lowers the rider and shrinks the broom model together, so compensate with
        # display.head scale/translation in the resource pack model.
        # armor_stand_scale: 0.5
        # Crash checks: box size (x,y,z). When set, the box starts at the armor stand's feet, moved by
        # hitbox_offset (x = forward, y = up, z = right). Sliding along the floor is allowed; touching
        # the ground only crashes when aiming down more steeply than crash_ground_angle (degrees).
        # hitbox_size: 0.6,0.4,0.6
        # hitbox_offset: 0,0,0
        # crash_ground_angle: 20
        # Draw the broom on an item display riding the armor stand instead of as its helmet,
        # so it stays full size at any armor_stand_scale (uses the model's "head" display settings).
        # mount_display: true
        # mount_display_scale: 1
        # mount_display_offset: 0,0,0       # from the stand's feet: x = forward, y = up, z = right
        # mount_display_interpolation: 2    # ticks of client-side rotation smoothing, 0 = instant
        # mount_display_yaw_offset: 0       # degrees, if the broom points the wrong way

        # Upgrades with level
        steer_speed: 0.03

        # Upgrades with items
        max_speed: 1.25
        max_acceleration: 0.015

crudbroom:
  inherit: broom
  parameters:
    max_speed: 1
    max_acceleration: 0.01

broom|2:
  upgrade_required_casts: 30
